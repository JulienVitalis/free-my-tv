# Free My TV settings for Julien's Philips 55PUS8106 (Bordeaux). The build workflow copies this file to
# config.properties and adds the TMDB key from the repository secret TMDB_KEY.
tmdb_key=
tmdb_region=FR
latitude=44.8378
longitude=-0.5792
city=Bordeaux
hide_animation=false
language=fr
show_crypto=false
currency=EUR
temperature=C
theme=auto
disable_assistant=false
# Keep the TV's own screensaver (Toile de fond, with its photos)
screensaver=false
hide_services=
hide_apps=
shelf_apps=
watchmode_key=
drawer_first=false
