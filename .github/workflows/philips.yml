# Builds the APK for the Philips TV with config.philips.properties and publishes it as the release "philips".
# The TMDB key (for the "For you" picks) comes from the repository secret TMDB_KEY, so it never shows in the code.
# The signing key comes from the optional secret SIGNING_KEYSTORE (the keystore in base64): with it, every new APK
# installs over the last one. Without it, build.sh makes a new key each run, and an update needs an uninstall first.
# With it, the app also updates itself from this release (Home Settings > Updates): each build's version is
# 1.2.<run number>, in the release's title, and the key's certificate goes into the app so only APKs signed with it
# come in.
name: Philips build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philips-build

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Settings and signing key
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          cp config.philips.properties config.properties
          [ -n "$TMDB_KEY" ] && printf '\ntmdb_key=%s\n' "$TMDB_KEY" >> config.properties || echo "No TMDB_KEY secret: no picks"
          if [ -n "$SIGNING_KEYSTORE" ]; then
            # A secret pasted in part (or with the terminal's prompt) decodes to a broken keystore: said plainly.
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \r\n' | base64 -d > freemytv.keystore 2>/dev/null \
              || { echo "::error::SIGNING_KEYSTORE isn't valid base64 (copied in part?)"; exit 1; }
            keytool -list -keystore freemytv.keystore -alias freemytv -storepass freemytv > /dev/null 2>&1 \
              || { echo "::error::SIGNING_KEYSTORE decodes ($(wc -c < freemytv.keystore) bytes) but isn't a keystore with the alias freemytv and the password freemytv (copied in part?)"; exit 1; }
            cert="$(keytool -exportcert -keystore freemytv.keystore -alias freemytv -storepass freemytv | sha256sum | cut -d' ' -f1)"
            printf '\nrelease_cert=%s\n' "$cert" >> config.properties
          else
            echo "No SIGNING_KEYSTORE secret: a new key, no updates from the app"
          fi
      - name: Version
        run: |
          echo "VERSION=1.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i -e 's/android:versionCode="[0-9]*"/android:versionCode="'$((1000 + ${{ github.run_number }}))'"/' \
                 -e 's/android:versionName="[^"]*"/android:versionName="1.2.${{ github.run_number }}"/' app/AndroidManifest.xml
      - name: Build
        run: |
          # The last lines of a failed build also go into an annotation, readable without the log.
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || { echo "::error::$(tail -5 build.log | tr '\n' ' ')"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete philips --yes --cleanup-tag 2>/dev/null || true
          gh release create philips FreeMyTV.apk --title "Free My TV $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Install: adb install -r FreeMyTV.apk"
